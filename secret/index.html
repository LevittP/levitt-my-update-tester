<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Game Library</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* =========================
       NORMAL THEME
       ========================= */

    .topbar {
      height: 68px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      gap: 14px;

      padding: 12px 18px;

      background: rgba(8, 18, 32, .9);
      backdrop-filter: blur(18px);

      border-bottom:
        1px solid rgba(255,255,255,.1);

      transition:
        background .3s,
        border-color .3s;
    }

    .title {
      font-size: 21px;
      font-weight: 700;
      white-space: nowrap;
    }

    #search {
      flex: 1;
      max-width: 500px;
      margin-left: auto;

      padding: 11px 15px;

      border-radius: 12px;

      border:
        1px solid rgba(255,255,255,.12);

      outline: none;

      background:
        rgba(255,255,255,.06);

      color: white;

      transition:
        background .3s,
        border-color .3s;
    }

    #search::placeholder {
      color:
        rgba(255,255,255,.4);
    }

    .chat-button {
      flex-shrink: 0;

      width: 40px;
      height: 40px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      border:
        1px solid rgba(255,255,255,.12);

      background:
        rgba(255,255,255,.06);

      color: white;

      cursor: pointer;

      text-decoration: none;

      transition:
        background .15s,
        transform .15s,
        border .15s,
        color .3s;
    }

    .chat-button:hover {
      background:
        rgba(255,255,255,.12);

      border-color:
        rgba(100,170,255,.35);

      transform:
        translateY(-1px);
    }

    .chat-button svg {
      width: 20px;
      height: 20px;
    }

    .status {
      font-size: 12px;

      color:
        rgba(255,255,255,.5);

      white-space: nowrap;
    }

    .layout {
      flex: 1;
      min-height: 0;

      display: flex;
    }

    .sidebar {
      width: 300px;
      flex-shrink: 0;

      overflow-y: auto;

      padding: 18px;

      background:
        rgba(4,12,24,.92);

      border-right:
        1px solid rgba(255,255,255,.08);

      transition:
        background .3s,
        border-color .3s;
    }

    .sidebar h2 {
      margin: 0 0 14px;

      font-size: 13px;

      color:
        rgba(255,255,255,.45);

      text-transform: uppercase;

      letter-spacing: 1px;
    }

    .games {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .game {
      width: 100%;

      padding: 13px 14px;

      border:
        1px solid transparent;

      border-radius: 11px;

      background:
        rgba(255,255,255,.045);

      color: white;

      cursor: pointer;

      text-align: left;

      transition:
        background .15s,
        transform .15s,
        border .15s;
    }

    .game:hover {
      background:
        rgba(255,255,255,.09);

      transform:
        translateX(2px);
    }

    .game.active {
      background:
        rgba(70,130,220,.18);

      border-color:
        rgba(100,170,255,.35);
    }

    .game-name {
      font-size: 14px;
      font-weight: 600;
    }

    .game-file {
      margin-top: 4px;

      font-size: 11px;

      color:
        rgba(255,255,255,.35);
    }

    .content {
      position: relative;

      flex: 1;

      min-width: 0;
      min-height: 0;

      background: #000;
    }

    #gameFrame {
      display: none;

      width: 100%;
      height: 100%;

      border: 0;

      background: white;
    }

    .fullscreen-button {
      position: absolute;

      top: 12px;
      right: 12px;

      z-index: 20;

      width: 34px;
      height: 34px;

      padding: 0;

      border: 0;

      border-radius: 8px;

      background: #1677ff;

      color: white;

      cursor: pointer;

      font-size: 20px;

      line-height: 34px;

      text-align: center;

      opacity: .9;

      box-shadow:
        0 4px 14px rgba(0,0,0,.4);

      transition:
        opacity .15s,
        transform .15s,
        background .15s;
    }

    .fullscreen-button:hover {
      opacity: 1;

      transform:
        scale(1.06);

      background: #2582ff;
    }

    .fullscreen-button:active {
      transform:
        scale(.94);
    }

    #gameFrame:fullscreen
      ~ .fullscreen-button {
      display: none !important;
    }

    #gameFrame:fullscreen {
      width: 100vw;
      height: 100vh;

      border: 0;

      background: #000;
    }

    #gameFrame::backdrop {
      background: #000;
    }

    .welcome {
      position: absolute;

      inset: 0;

      display: flex;

      justify-content: center;
      align-items: center;

      flex-direction: column;

      text-align: center;

      color:
        rgba(255,255,255,.5);
    }

    .welcome h1 {
      margin: 0 0 8px;

      color: white;
    }

    .loading {
      position: absolute;

      inset: 0;

      z-index: 5;

      display: none;

      justify-content: center;
      align-items: center;

      background: #000;
    }

    .loading.show {
      display: flex;
    }

    .spinner {
      width: 36px;
      height: 36px;

      margin: 0 auto 14px;

      border:
        3px solid rgba(255,255,255,.15);

      border-top-color: white;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }

    .error {
      margin-top: 14px;

      padding: 12px;

      border-radius: 10px;

      background:
        rgba(255,60,60,.1);

      border:
        1px solid rgba(255,80,80,.25);

      color: #ffaaaa;

      font-size: 12px;

      line-height: 1.4;
    }


    /* =========================
       HALLOWEEN THEME
       Active ONLY during October
       ========================= */

    body.halloween {
      background:
        radial-gradient(
          circle at 50% -20%,
          #3b1605 0%,
          #120805 45%,
          #050505 100%
        );
    }

    body.halloween .topbar {
      background:
        rgba(20, 8, 3, .92);

      border-bottom:
        1px solid rgba(255, 105, 0, .28);
    }

    body.halloween .title {
      color: #ff8a18;

      text-shadow:
        0 0 10px rgba(255,100,0,.35);
    }

    body.halloween #search {
      background:
        rgba(255, 105, 0, .07);

      border-color:
        rgba(255, 120, 20, .22);
    }

    body.halloween #search:focus {
      border-color:
        rgba(255, 140, 40, .6);

      box-shadow:
        0 0 0 3px rgba(255,100,0,.08);
    }

    body.halloween .chat-button {
      background:
        rgba(255, 90, 0, .07);

      border-color:
        rgba(255, 120, 20, .2);
    }

    body.halloween .chat-button:hover {
      background:
        rgba(255, 100, 0, .16);

      border-color:
        rgba(255, 140, 40, .5);

      color: #ff9d2e;
    }

    body.halloween .sidebar {
      background:
        rgba(13, 6, 3, .94);

      border-right:
        1px solid rgba(255, 100, 0, .15);
    }

    body.halloween .sidebar h2 {
      color:
        rgba(255, 145, 50, .65);
    }

    body.halloween .game {
      background:
        rgba(255, 100, 0, .045);
    }

    body.halloween .game:hover {
      background:
        rgba(255, 100, 0, .12);

      border-color:
        rgba(255, 130, 30, .18);
    }

    body.halloween .game.active {
      background:
        rgba(255, 90, 0, .18);

      border-color:
        rgba(255, 140, 40, .5);

      box-shadow:
        0 0 18px rgba(255, 80, 0, .08);
    }

    body.halloween .fullscreen-button {
      background: #e85d04;

      box-shadow:
        0 4px 18px rgba(255, 80, 0, .3);
    }

    body.halloween .fullscreen-button:hover {
      background: #ff7208;
    }

    /* Halloween welcome text */

    body.halloween .welcome h1::before {
      content: "🎃 ";
    }

    body.halloween .welcome h1::after {
      content: " 🎃";
    }

    body.halloween .welcome h1 {
      text-shadow:
        0 0 15px rgba(255,100,0,.3);
    }

    /* Halloween loading spinner */

    body.halloween .spinner {
      border-color:
        rgba(255, 120, 20, .15);

      border-top-color:
        #ff7417;
    }

    /* Halloween content background */

    body.halloween .content {
      background:
        radial-gradient(
          circle at center,
          #160a04 0%,
          #050505 70%
        );
    }

    /* Halloween scrollbar */

    body.halloween ::-webkit-scrollbar {
      width: 8px;
    }

    body.halloween ::-webkit-scrollbar-track {
      background: #090504;
    }

    body.halloween ::-webkit-scrollbar-thumb {
      background: #6d2908;
      border-radius: 10px;
    }

    body.halloween ::-webkit-scrollbar-thumb:hover {
      background: #a83f0b;
    }



    /* =========================
       SOURCE PICKER + THUMBNAILS
       ========================= */

    .source-picker {
      margin-bottom: 18px;
    }

    .source-picker label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: rgba(255,255,255,.45);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #sourceSelect {
      width: 100%;
      padding: 10px 12px;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,.12);
      outline: none;
      background: rgba(255,255,255,.06);
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: background .3s, border-color .3s;
    }

    #sourceSelect:focus {
      border-color: rgba(100,170,255,.45);
    }

    #sourceSelect option {
      background: #0b1626;
      color: white;
    }

    .game {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .game-text {
      min-width: 0;
      flex: 1;
    }

    .game-name,
    .game-file {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .game-thumb {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 9px;
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.4);
      font-size: 18px;
      font-weight: 700;
    }

    .game-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    body.halloween .source-picker label {
      color: rgba(255,145,50,.65);
    }

    body.halloween #sourceSelect {
      background: rgba(255,105,0,.07);
      border-color: rgba(255,120,20,.22);
    }

    body.halloween #sourceSelect:focus {
      border-color: rgba(255,140,40,.6);
    }

    body.halloween #sourceSelect option {
      background: #1a0b04;
    }

    body.halloween .game-thumb {
      background: rgba(255,100,0,.1);
    }

    @media(max-width:700px) {

      .sidebar {
        width: 220px;
      }

      .title {
        display: none;
      }

      .status {
        display: none;
      }

    }

  </style>

</head>

<body>

  <header class="topbar">

    <div class="title">
      Game Library
    </div>

    <input
      id="search"
      type="text"
      placeholder="Search games..."
      autocomplete="off"
    >

    <!-- Watch -->

    <a
      id="watchButton"
      href="#"
      class="chat-button"
      title="Watch"
      aria-label="Watch"
    >

      <svg
        viewBox="0 0 24 24"
        fill="currentColor"
        aria-hidden="true"
      >

        <path
          d="M8 5.14v13.72a1 1 0 0 0 1.54.84l10.2-6.86a1 1 0 0 0 0-1.68L9.54 4.3A1 1 0 0 0 8 5.14z"
        />

      </svg>

    </a>


    <!-- Chat -->

    <a
      href="/chatting"
      class="chat-button"
      title="Chat"
      aria-label="Chat"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >

        <path
          d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 8 8v.5z"
        />

      </svg>

    </a>


    <div
      id="status"
      class="status"
    >
      Scanning...
    </div>

  </header>


  <div class="layout">

    <aside class="sidebar">

      <div class="source-picker">

        <label for="sourceSelect">Source</label>

        <select id="sourceSelect">
          <option value="selenite">Selenite</option>
          <option value="archive">Archive.org</option>
        </select>

      </div>

      <h2>Games</h2>

      <div
        id="games"
        class="games"
      ></div>

      <div id="error"></div>

    </aside>


    <main class="content">

      <button
        id="fullscreenButton"
        class="fullscreen-button"
        type="button"
        title="Fullscreen"
        aria-label="Fullscreen"
        style="display:none;"
      >
        ⛶
      </button>


      <div
        id="welcome"
        class="welcome"
      >

        <h1>Select a game</h1>

        <p>
          Select a game from the library.
        </p>

      </div>


      <div
        id="loading"
        class="loading"
      >

        <div>

          <div class="spinner"></div>

          <div>
            Loading game...
          </div>

        </div>

      </div>


      <iframe
        id="gameFrame"
        title="Game"
        allow="fullscreen; autoplay; gamepad"
        allowfullscreen
      ></iframe>

    </main>

  </div>


  <script src="/secret/selenite-loader.js"></script>

  <script>

    /*
     * =========================
     * AUTOMATIC HALLOWEEN MODE
     * =========================
     *
     * October = Halloween theme.
     * Every other month = normal theme.
     *
     * JavaScript months are zero-based:
     * January = 0
     * October = 9
     */

    function updateSeasonalTheme() {

      const month =
        new Date().getMonth();

      const isHalloween =
        month === 9;

      document.body.classList.toggle(
        "halloween",
        isHalloween
      );

    }


    updateSeasonalTheme();


    /* Archive.org source */

    const ARCHIVE_METADATA_URL =
      "https://archive.org/metadata/ugsfiles";

    const ARCHIVE_API_URL =
      "https://molineshop.vercel.app/api/game?file=";


    /* Selenite games use /secret/selenite-loader.js */


    const gamesElement =
      document.getElementById("games");

    const searchElement =
      document.getElementById("search");

    const sourceSelect =
      document.getElementById("sourceSelect");

    const statusElement =
      document.getElementById("status");

    const errorElement =
      document.getElementById("error");

    const frame =
      document.getElementById("gameFrame");

    const welcome =
      document.getElementById("welcome");

    const loading =
      document.getElementById("loading");

    const fullscreenButton =
      document.getElementById(
        "fullscreenButton"
      );

    const watchButton =
      document.getElementById(
        "watchButton"
      );


    let games = [];

    let selectedGame = null;

    let currentSource = "selenite";

    let sourceToken = 0;


    /*
     * Load the Watch destination
     * from watch-config.json.
     */

    async function setupWatchButton() {

      try {

        const response =
          await fetch(
            "/watch-config.json",
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Could not load watch-config.json"
          );

        }


        const config =
          await response.json();


        if (
          !config.url ||
          typeof config.url !== "string"
        ) {

          throw new Error(
            "watch-config.json does not contain a valid URL"
          );

        }


        const url =
          new URL(
            config.url,
            window.location.origin
          );


        if (
          url.protocol !== "https:" &&
          url.protocol !== "http:"
        ) {

          throw new Error(
            "Invalid Watch URL protocol"
          );

        }


        watchButton.href =
          url.href;


      } catch (error) {

        console.error(
          "Watch configuration error:",
          error
        );


        watchButton.href =
          "#";


        watchButton.addEventListener(
          "click",
          event => {

            event.preventDefault();

          }
        );

      }

    }


    /*
     * Get the display name of a game.
     */

    function getDisplayName(filename) {

      let name = filename;


      if (
        name
          .toLowerCase()
          .startsWith("cl")
      ) {

        name =
          name.substring(2);

      }


      if (
        name
          .toLowerCase()
          .endsWith(".html")
      ) {

        name =
          name.substring(
            0,
            name.length - 5
          );

      }


      return name
        .replace(/[_-]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();

    }


    /*
     * Escape HTML.
     */

    function escapeHTML(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /*
     * Throttled thumbnail loading for Selenite games.
     */

    const thumbQueue = [];

    let thumbActive = 0;

    const THUMB_CONCURRENCY = 6;


    function setThumbImage(thumb, game) {

      if (!game.thumbURL) return;

      const img = new Image();

      img.alt = "";

      img.onload = () => {

        thumb.textContent = "";

        thumb.appendChild(img);

      };

      img.src = game.thumbURL;

    }


    function pumpThumbs() {

      while (
        thumbActive < THUMB_CONCURRENCY &&
        thumbQueue.length
      ) {

        const { game, thumb } = thumbQueue.shift();

        thumbActive++;

        SeleniteLoader.thumbnailURL(game)
          .then(() => setThumbImage(thumb, game))
          .catch(() => {})
          .finally(() => {

            thumbActive--;

            pumpThumbs();

          });

      }

    }


    const thumbObserver =
      "IntersectionObserver" in window
        ? new IntersectionObserver(
            entries => {

              for (const entry of entries) {

                if (!entry.isIntersecting) continue;

                thumbObserver.unobserve(entry.target);

                thumbQueue.push({
                  game: entry.target._game,
                  thumb: entry.target
                });

              }

              pumpThumbs();

            },
            {
              root: document.querySelector(".sidebar"),
              rootMargin: "300px"
            }
          )
        : null;


    /*
     * Sources.
     */

    async function loadArchiveGames() {

      const response =
        await fetch(
          ARCHIVE_METADATA_URL,
          { cache: "no-store" }
        );

      if (!response.ok) {

        throw new Error(
          "Archive.org returned HTTP " +
          response.status
        );

      }

      const metadata = await response.json();

      return metadata.files
        .map(file => file.name)
        .filter(filename =>
          filename.toLowerCase().endsWith(".html")
        )
        .map(filename => ({
          key: "archive:" + filename,
          source: "archive",
          filename,
          label: filename,
          name: getDisplayName(filename)
        }));

    }


    async function loadSeleniteGames() {

      return SeleniteLoader.listGames();

    }


    /*
     * Scan the selected source for games.
     */

    async function scanGames() {

      const token = ++sourceToken;

      const source = currentSource;

      games = [];

      errorElement.innerHTML = "";

      gamesElement.innerHTML =
        `<div style="
          color:rgba(255,255,255,.4);
          padding:10px;
        ">Loading...</div>`;

      try {

        statusElement.textContent =
          source === "archive"
            ? "Scanning Archive.org..."
            : "Scanning Selenite...";

        const list =
          source === "archive"
            ? await loadArchiveGames()
            : await loadSeleniteGames();

        if (token !== sourceToken) return;

        games =
          list.sort((a, b) =>
            a.name.localeCompare(
              b.name,
              undefined,
              {
                numeric: true,
                sensitivity: "base"
              }
            )
          );

        renderGames(searchElement.value);

        statusElement.textContent =
          games.length + " games found";

      } catch (error) {

        if (token !== sourceToken) return;

        console.error(error);

        gamesElement.innerHTML = "";

        statusElement.textContent = "Scan failed";

        errorElement.innerHTML =
          `<div class="error">
            ${escapeHTML(error.message)}
          </div>`;

      }

    }


    /*
     * Render the game list.
     */

    function renderGames(
      filter = ""
    ) {

      gamesElement.innerHTML = "";


      const query =
        filter
          .toLowerCase()
          .trim();


      const visibleGames =
        games.filter(game =>

          game.name
            .toLowerCase()
            .includes(query)

          ||

          game.label
            .toLowerCase()
            .includes(query)

        );


      for (
        const game of visibleGames
      ) {

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "game";


        if (
          selectedGame &&
          selectedGame.key === game.key
        ) {

          button.classList.add(
            "active"
          );

        }


        if (game.source === "selenite") {

          const thumb =
            document.createElement("div");

          thumb.className = "game-thumb";

          thumb.textContent =
            game.name.charAt(0).toUpperCase();

          thumb._game = game;

          button.appendChild(thumb);

          if (game.thumbURL) {

            setThumbImage(thumb, game);

          } else if (game.thumbURL === null) {

            /* no photo for this game */

          } else if (thumbObserver) {

            thumbObserver.observe(thumb);

          } else {

            thumbQueue.push({ game, thumb });

            pumpThumbs();

          }

        }


        const text =
          document.createElement("div");

        text.className = "game-text";

        text.innerHTML = `

          <div class="game-name">
            ${escapeHTML(
              game.name
            )}
          </div>

          <div class="game-file">
            ${escapeHTML(
              game.label
            )}
          </div>

        `;

        button.appendChild(text);


        button.onclick = () =>
          launchGame(game);


        gamesElement.appendChild(
          button
        );

      }


      if (
        visibleGames.length === 0
      ) {

        gamesElement.innerHTML =
          `<div style="
            color:rgba(255,255,255,.4);
            padding:10px;
          ">
            No games found.
          </div>`;

      }

    }


    /*
     * Enter fullscreen.
     */

    async function enterFullscreen() {

      try {

        if (
          frame.requestFullscreen
        ) {

          await frame.requestFullscreen();

        }

      } catch (error) {

        console.error(
          "Fullscreen failed:",
          error
        );

      }

    }


    /*
     * Fullscreen button click.
     */

    fullscreenButton.addEventListener(
      "click",
      enterFullscreen
    );


    /*
     * Fullscreen state.
     */

    document.addEventListener(
      "fullscreenchange",
      () => {

        const isFullscreen =
          document.fullscreenElement !== null;


        if (isFullscreen) {

          fullscreenButton.style.display =
            "none";

        } else if (
          frame.style.display ===
          "block"
        ) {

          fullscreenButton.style.display =
            "block";

        }

      }
    );


    /*
     * Get the HTML of a game from its source.
     */

    async function fetchGameHtml(game) {

      if (game.source === "archive") {

        const response =
          await fetch(
            ARCHIVE_API_URL +
            encodeURIComponent(game.filename)
          );

        if (!response.ok) {

          const data =
            await response
              .json()
              .catch(() => null);

          throw new Error(
            data?.error ||
            "Server returned HTTP " +
            response.status
          );

        }

        return response.text();

      }


      /* Selenite (GitLab) - separate loader */

      return SeleniteLoader.loadGame(game);

    }


    /*
     * Launch a game.
     */

    async function launchGame(game) {

      selectedGame = game;

      renderGames(
        searchElement.value
      );


      if (
        document.fullscreenElement
      ) {

        try {

          await document.exitFullscreen();

        } catch (error) {

          console.error(
            "Could not exit fullscreen:",
            error
          );

        }

      }


      welcome.style.display =
        "none";


      frame.style.display =
        "none";


      fullscreenButton.style.display =
        "none";


      loading.classList.add(
        "show"
      );


      errorElement.innerHTML =
        "";


      try {

        const html =
          await fetchGameHtml(game);


        if (selectedGame !== game) return;


        frame.onload = () => {

          loading.classList.remove(
            "show"
          );

          frame.style.display =
            "block";


          fullscreenButton.style.display =
            "block";

        };


        frame.srcdoc =
          html;


      } catch (error) {

        console.error(
          "Game error:",
          error
        );


        loading.classList.remove(
          "show"
        );


        fullscreenButton.style.display =
          "none";


        errorElement.innerHTML =
          `<div class="error">

            <strong>
              Game failed to load
            </strong>

            <br><br>

            ${escapeHTML(
              error.message
            )}

          </div>`;

      }

    }


    /*
     * Search games.
     */

    searchElement.addEventListener(
      "input",
      () => {

        renderGames(
          searchElement.value
        );

      }
    );


    /*
     * Start everything.
     */

    /*
     * Source dropdown (remembers your choice).
     */

    try {

      const saved =
        localStorage.getItem("lib:source");

      if (saved === "archive" || saved === "selenite") {
        currentSource = saved;
      }

    } catch (error) {

      /* ignore */

    }

    sourceSelect.value = currentSource;

    sourceSelect.addEventListener(
      "change",
      () => {

        currentSource = sourceSelect.value;

        try {

          localStorage.setItem(
            "lib:source",
            currentSource
          );

        } catch (error) {

          /* ignore */

        }

        scanGames();

      }
    );


    setupWatchButton();

    scanGames();

  </script>

</body>

</html>
